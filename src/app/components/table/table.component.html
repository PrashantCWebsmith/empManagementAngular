<table mat-table [dataSource]="data" class="mat-elevation-z8">

  <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column.key">
    <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>

    <td mat-cell *matCellDef="let element">
      <!-- Show action buttons if 'actions' column, otherwise display data -->
      <ng-container *ngIf="column.key === 'actions'; else showData">
        <button mat-button color="primary" (click)="onEdit(element)">Edit</button>
        <button mat-button color="warn" (click)="onDelete(element)">Delete</button>
      </ng-container>

      <ng-template #showData>
        {{ element[column.key] }}
      </ng-template>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnKeys"></tr>
  <tr mat-row *matRowDef="let row; columns: columnKeys;"></tr>
</table>
